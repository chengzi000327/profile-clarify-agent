# Exact-source DeepSeek Harness JSON-RPC composition for the role clarifier.
# It intentionally contains no shell, filesystem, web, skill, workflow, goal,
# todo, terminal, or subagent model-facing tool.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high
    maxTokens: 16384
    streamIdleTimeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: false
    persona: ''
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    maxParallelToolCalls: 1
    tools:
      mode: native
    toolOrder:
      - read_role_state
      - save_fact_draft
      - save_artifact_draft
      - save_candidate_evidence
      - propose_calibration_signal
      - read_version_diff
      - '<unlisted-tools>'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.dsh-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: role-clarifier-domain
  name: './lib/index.js'
  config:
    apiBaseUrl: !!js process.env.ROLE_AGENT_INTERNAL_URL ?? 'http://127.0.0.1:4100'
    toolToken: !!js process.env.ROLE_AGENT_TOOL_TOKEN ?? ''
    timeoutMs: 5000
